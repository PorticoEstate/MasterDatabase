spring.application.name=masterdatabase

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/masterdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Flyway eier skjemaet (migrasjoner i db/migration)
spring.flyway.enabled=true

# Legger til detaljer når spring bygger httprespons fra error (synligjør detaljen i svaret som du der for eks. i Bruno)
spring.mvc.problemdetails.enabled=true

# springdoc: OpenAPI-spesifikasjon genereres fra controllerne
springdoc.api-docs.path=/masterdb/api-docs
springdoc.swagger-ui.path=/masterdb/swagger-ui.html

# API key for the protected endpoints. Set MASTERDB_API_KEY in .env; no default,
masterdb.api-key=${MASTERDB_API_KEY}

# Job server in the etl container (internal network only; no authentication, see etl/jobserver.py)
etl.url=${ETL_URL:http://etl:8000}
