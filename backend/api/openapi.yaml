openapi: 3.1.0
info:
  title: MasterDB API
  description: "Search across municipalities (returns hits and links to the local\
    \ booking system, never checks availability or books anything), and administration\
    \ of kommuner (requires an API key)."
  version: v1
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Kommune
  description: "Create, read, update and delete kommuner. Requires an API key."
- name: Search
  description: Search across municipalities
paths:
  /masterdb/kommune/{id}:
    get:
      tags:
      - Kommune
      summary: Get a kommune by id
      operationId: getById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: No kommune with this id
        "401":
          description: Missing or invalid API key
      security:
      - apiKey: []
    put:
      tags:
      - Kommune
      summary: Update a kommune
      description: "Replaces kommunenr, navn and fylkesnavn. A fylkesnavn left out\
        \ of the body is set to null. kommunenr can be changed here, e.g. when a kommune\
        \ is renumbered."
      operationId: updateKommune
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KommuneRequest"
        required: true
      responses:
        "400":
          description: "Invalid body (kommunenr not 4 digits, or navn missing)"
        "404":
          description: No kommune with this id
        "409":
          description: Another kommune already has this kommunenr
        "401":
          description: Missing or invalid API key
      security:
      - apiKey: []
    delete:
      tags:
      - Kommune
      summary: Delete a kommune
      description: "Also deletes everything that belongs to the kommune: buildings,\
        \ addresses, streets and resources (ON DELETE CASCADE). This cannot be undone."
      operationId: deleteKommune
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: No kommune with this id
        "401":
          description: Missing or invalid API key
        "204":
          description: No Content
      security:
      - apiKey: []
  /masterdb/kommune:
    get:
      tags:
      - Kommune
      summary: List all kommuner
      description: "All kommuner, ordered by name."
      operationId: getAll
      responses:
        "401":
          description: Missing or invalid API key
      security:
      - apiKey: []
    post:
      tags:
      - Kommune
      summary: Create a kommune
      description: Returns the created kommune including its generated id.
      operationId: createKommune
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KommuneRequest"
        required: true
      responses:
        "400":
          description: "Invalid body (kommunenr not 4 digits, or navn missing)"
        "409":
          description: A kommune with this kommunenr already exists
        "401":
          description: Missing or invalid API key
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Kommune"
      security:
      - apiKey: []
  /masterdb/search:
    get:
      tags:
      - Search
      summary: Search buildings and resources
      description: "Free-text search with filters (municipality, venue type, activity,\
        \ facility) and optional radius around a point. Returns building cards and\
        \ a resource list. Never checks availability or books anything."
      operationId: sok
      parameters:
      - name: q
        in: query
        description: "Fritekst. Treffer navn, bygg, lokaletype, aktiviteter, fasiliteter\
          \ og sted."
        required: false
        schema:
          type: string
        example: badminton
      - name: kommune
        in: query
        description: "Kommunenummer (4 siffer), ikke navn. Gyldige verdier: kommuner[].kode\
          \ fra /masterdb/search/filter."
        required: false
        schema:
          type: array
          items:
            type: string
        example: 4601
      - name: lokaletype
        in: query
        description: "lokaletype.id. Gyldige verdier: lokaletyper[].id fra /masterdb/search/filter."
        required: false
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: aktivitet
        in: query
        description: "aktivitet.id. Gyldige verdier: aktiviteter[].id fra /masterdb/search/filter.\
          \ ELLER mellom valgene."
        required: false
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: fasilitet
        in: query
        description: "fasilitet.id. Gyldige verdier: fasiliteter[].id fra /masterdb/search/filter.\
          \ OG mellom valgene."
        required: false
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: lat
        in: query
        description: Breddegrad for nærhetssøk. Krever lon og radiusMeter.
        required: false
        schema:
          type: number
          format: double
        example: 60.39
      - name: lon
        in: query
        description: Lengdegrad for nærhetssøk. Krever lat og radiusMeter.
        required: false
        schema:
          type: number
          format: double
        example: 5.32
      - name: radiusMeter
        in: query
        description: "Radius i meter rundt lat/lon, maks 50 000."
        required: false
        schema:
          type: integer
          format: int32
        example: 5000
      - name: sorter
        in: query
        description: "relevans | avstand | navn. Standard: avstand ved nærhetssøk,\
          \ relevans ved fritekst, ellers navn."
        required: false
        schema:
          type: string
      - name: side
        in: query
        description: "Sidenummer, 0-indeksert."
        required: false
        schema:
          type: integer
          format: int32
        example: 0
      - name: storrelse
        in: query
        description: "Treff per side, standard 20, maks 100."
        required: false
        schema:
          type: integer
          format: int32
        example: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SokSvar"
  /masterdb/search/filter:
    get:
      tags:
      - Search
      summary: List filter options
      description: "Municipalities (code + name) and venue types, activities and facilities\
        \ (id + name) that are linked to a bookable resource."
      operationId: filtre
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SokFiltre"
components:
  schemas:
    KommuneRequest:
      type: object
      properties:
        kommunenr:
          type: string
          description: "Kommune number, exactly 4 digits"
          example: "4601"
          minLength: 1
          pattern: "[0-9]{4}"
        navn:
          type: string
          description: Kommune name
          example: Bergen
          minLength: 1
        fylkesnavn:
          type: string
          description: County name. Optional; null when left out.
          example: Vestland
      required:
      - kommunenr
      - navn
    Kommune:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: "Internal id, generated by the database. Use it in the URL\
            \ for get, update and delete."
          example: 17
        kommunenr:
          type: string
          description: "Kommune number, 4 digits"
          example: "4601"
        navn:
          type: string
          description: Kommune name
          example: Bergen
        fylkesnavn:
          type: string
          description: "County name, may be null"
          example: Vestland
    ByggSokTreff:
      type: object
      properties:
        byggId:
          type: integer
          format: int64
        byggNavn:
          type: string
        bydelNavn:
          type: string
        kommuneNavn:
          type: string
        adressetekst:
          type: string
        postnummer:
          type: string
        poststed:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        avstandMeter:
          type: number
          format: double
        antallRessurser:
          type: integer
          format: int32
        bookingUrl:
          type: string
        bildeUrl:
          type: string
    RessursSokTreff:
      type: object
      properties:
        ressursId:
          type: integer
          format: int64
        navn:
          type: string
        byggNavn:
          type: string
        kommuneNavn:
          type: string
        adressetekst:
          type: string
        postnummer:
          type: string
        poststed:
          type: string
        lokaletypeNavn:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        avstandMeter:
          type: number
          format: double
        bookingUrl:
          type: string
        bildeUrl:
          type: string
    SokSvar:
      type: object
      properties:
        bygg:
          $ref: "#/components/schemas/SokeResultatByggSokTreff"
        ressurser:
          $ref: "#/components/schemas/SokeResultatRessursSokTreff"
    SokeResultatByggSokTreff:
      type: object
      properties:
        treff:
          type: array
          items:
            $ref: "#/components/schemas/ByggSokTreff"
        totalt:
          type: integer
          format: int64
        side:
          type: integer
          format: int32
        storrelse:
          type: integer
          format: int32
    SokeResultatRessursSokTreff:
      type: object
      properties:
        treff:
          type: array
          items:
            $ref: "#/components/schemas/RessursSokTreff"
        totalt:
          type: integer
          format: int64
        side:
          type: integer
          format: int32
        storrelse:
          type: integer
          format: int32
    FilterValg:
      type: object
      properties:
        kode:
          type: string
        navn:
          type: string
    IdValg:
      type: object
      properties:
        id:
          type: integer
          format: int64
        navn:
          type: string
    SokFiltre:
      type: object
      properties:
        kommuner:
          type: array
          items:
            $ref: "#/components/schemas/FilterValg"
        lokaletyper:
          type: array
          items:
            $ref: "#/components/schemas/IdValg"
        aktiviteter:
          type: array
          items:
            $ref: "#/components/schemas/IdValg"
        fasiliteter:
          type: array
          items:
            $ref: "#/components/schemas/IdValg"
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-API-KEY
      in: header
