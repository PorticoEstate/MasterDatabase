openapi: 3.1.0
info:
  title: MasterDB API
  description: "Search across municipalities (returns hits and links to the local\
    \ booking system, never checks availability or books anything), and administration\
    \ of kommuner (requires an API key)."
  version: v1
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Fasilitet
  description: Update and delete fasiliteter. Requires an API key.
- name: Kommune
  description: "Create, read, update and delete kommuner. Requires an API key."
- name: Lokaletype
  description: Update and delete lokaletyper. Requires an API key.
- name: Aktivitet
  description: Update and delete aktiviteter. Requires an API key.
- name: Search
  description: Search across municipalities
paths:
  /masterdb/lokaletype/{id}:
    put:
      tags:
      - Lokaletype
      summary: Update a lokaletype
      description: "Replaces navn and parentId. A parentId left out of the body is\
        \ set to null, which makes the lokaletype top-level. The id cannot be changed."
      operationId: updateLokaletype
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LokaletypeUpdate"
        required: true
      responses:
        "400":
          description: "Invalid body (navn missing), parentId is the lokaletype itself,\
            \ or no lokaletype with the given parentId"
        "404":
          description: No lokaletype with this id
        "409":
          description: Another lokaletype already has this navn
        "401":
          description: Missing or invalid API key
      security:
      - apiKey: []
    delete:
      tags:
      - Lokaletype
      summary: Delete a lokaletype
      description: "Resources that have the lokaletype are kept, but lose it (lokaletype_id\
        \ is set to null). A lokaletype that is the parent of others cannot be deleted.\
        \ This cannot be undone."
      operationId: deleteLokaletype
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: No lokaletype with this id
        "409":
          description: The lokaletype is the parent of other lokaletyper
        "401":
          description: Missing or invalid API key
        "204":
          description: No Content
      security:
      - apiKey: []
  /masterdb/kommune/{id}:
    get:
      tags:
      - Kommune
      summary: Get a kommune by id
      operationId: getById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: No kommune with this id
        "401":
          description: Missing or invalid API key
      security:
      - apiKey: []
    put:
      tags:
      - Kommune
      summary: Update a kommune
      description: "Replaces kommunenr, navn and fylkesnavn. A fylkesnavn left out\
        \ of the body is set to null. kommunenr can be changed here, e.g. when a kommune\
        \ is renumbered. The booking system is not touched: its URL is set when the\
        \ kommune is created. To stop or resume syncing, use PATCH /{id}/booking."
      operationId: updateKommune
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KommuneUpdate"
        required: true
      responses:
        "400":
          description: Invalid body (kommunenr not 4 digits or navn missing)
        "404":
          description: No kommune with this id
        "409":
          description: Another kommune already has this kommunenr
        "401":
          description: Missing or invalid API key
      security:
      - apiKey: []
    delete:
      tags:
      - Kommune
      summary: Delete a kommune
      description: "Also deletes everything that belongs to the kommune: buildings,\
        \ addresses, streets and resources (ON DELETE CASCADE), and its booking system\
        \ registration unless another kommune uses it. This cannot be undone."
      operationId: deleteKommune
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: No kommune with this id
        "401":
          description: Missing or invalid API key
        "204":
          description: No Content
      security:
      - apiKey: []
  /masterdb/fasilitet/{id}:
    put:
      tags:
      - Fasilitet
      summary: Update a fasilitet
      description: "Replaces navn and parentId. A parentId left out of the body is\
        \ set to null, which makes the fasilitet top-level. The id cannot be changed."
      operationId: updateFasilitet
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FasilitetUpdate"
        required: true
      responses:
        "400":
          description: "Invalid body (navn missing), parentId is the fasilitet itself,\
            \ or no fasilitet with the given parentId"
        "404":
          description: No fasilitet with this id
        "409":
          description: Another fasilitet already has this navn
        "401":
          description: Missing or invalid API key
      security:
      - apiKey: []
    delete:
      tags:
      - Fasilitet
      summary: Delete a fasilitet
      description: Also removes the links from resources to the fasilitet (ON DELETE
        CASCADE). A fasilitet that is the parent of others cannot be deleted. This
        cannot be undone.
      operationId: deleteFasilitet
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: No fasilitet with this id
        "409":
          description: The fasilitet is the parent of other fasiliteter
        "401":
          description: Missing or invalid API key
        "204":
          description: No Content
      security:
      - apiKey: []
  /masterdb/aktivitet/{id}:
    put:
      tags:
      - Aktivitet
      summary: Update an aktivitet
      description: "Replaces navn and parentId. A parentId left out of the body is\
        \ set to null, which makes the aktivitet top-level. The id cannot be changed."
      operationId: updateAktivitet
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AktivitetUpdate"
        required: true
      responses:
        "400":
          description: "Invalid body (navn missing), parentId is the aktivitet itself,\
            \ or no aktivitet with the given parentId"
        "404":
          description: No aktivitet with this id
        "409":
          description: Another aktivitet already has this navn
        "401":
          description: Missing or invalid API key
      security:
      - apiKey: []
    delete:
      tags:
      - Aktivitet
      summary: Delete an aktivitet
      description: Also removes the links from resources to the aktivitet (ON DELETE
        CASCADE). An aktivitet that is the parent of others cannot be deleted. This
        cannot be undone.
      operationId: deleteAktivitet
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: No aktivitet with this id
        "409":
          description: The aktivitet is the parent of other aktiviteter
        "401":
          description: Missing or invalid API key
        "204":
          description: No Content
      security:
      - apiKey: []
  /masterdb/kommune:
    get:
      tags:
      - Kommune
      summary: List all kommuner
      description: "All kommuner, ordered by name. bookingBaseUrl and bookingAktiv\
        \ show which kommuner the nightly sync loads data for (those with a booking\
        \ system that is active)."
      operationId: getAll
      responses:
        "401":
          description: Missing or invalid API key
      security:
      - apiKey: []
    post:
      tags:
      - Kommune
      summary: Create a kommune
      description: "Returns the created kommune including its generated id. bookingBaseUrl\
        \ (https://<name>.aktiv-kommune.no) and active are required: the kommune's\
        \ Aktiv kommune booking system is registered with the given active status\
        \ in the same call. The nightly sync only loads data from the instance when\
        \ active is true."
      operationId: createKommune
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KommuneCreate"
        required: true
      responses:
        "400":
          description: "Invalid body (kommunenr not 4 digits, navn missing, bookingBaseUrl\
            \ missing or not https://<name>.aktiv-kommune.no, or active missing)"
        "409":
          description: "kommunenr already exists, or bookingBaseUrl is registered\
            \ for another kommune"
        "401":
          description: Missing or invalid API key
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Kommune"
      security:
      - apiKey: []
  /masterdb/kommune/{id}/booking:
    patch:
      tags:
      - Kommune
      summary: Include or exclude the booking system in the sync
      description: Sets whether the nightly sync loads data for this kommune. aktiv=false
        stops the sync but keeps the kommune and its data; aktiv=true resumes it.
        Idempotent. Returns the kommune.
      operationId: setBookingAktiv
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FagsystemStatusUpdate"
        required: true
      responses:
        "400":
          description: aktiv missing
        "404":
          description: No kommune with this id
        "409":
          description: The kommune has no booking system
        "401":
          description: Missing or invalid API key
      security:
      - apiKey: []
  /masterdb/search:
    get:
      tags:
      - Search
      summary: Search buildings and resources
      description: "Free-text search with filters (municipality, venue type, activity,\
        \ facility) and optional radius around a point. Returns building cards and\
        \ a resource list. Never checks availability or books anything."
      operationId: sok
      parameters:
      - name: fritekst
        in: query
        description: "Fritekst. Treffer navn, bygg, lokaletype, aktiviteter, fasiliteter\
          \ og sted."
        required: false
        schema:
          type: string
        example: badminton
      - name: kommune
        in: query
        description: "Kommunenummer (4 siffer), ikke navn. Gyldige verdier: kommuner[].kode\
          \ fra /masterdb/search/filter."
        required: false
        schema:
          type: array
          items:
            type: string
        example: 4601
      - name: lokaletype
        in: query
        description: "lokaletype.id. Gyldige verdier: lokaletyper[].id fra /masterdb/search/filter."
        required: false
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: aktivitet
        in: query
        description: "aktivitet.id. Gyldige verdier: aktiviteter[].id fra /masterdb/search/filter.\
          \ ELLER mellom valgene."
        required: false
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: fasilitet
        in: query
        description: "fasilitet.id. Gyldige verdier: fasiliteter[].id fra /masterdb/search/filter.\
          \ OG mellom valgene."
        required: false
        schema:
          type: array
          items:
            type: integer
            format: int64
      - name: lat
        in: query
        description: Breddegrad for nærhetssøk. Krever lon og radiusMeter.
        required: false
        schema:
          type: number
          format: double
        example: 60.39
      - name: lon
        in: query
        description: Lengdegrad for nærhetssøk. Krever lat og radiusMeter.
        required: false
        schema:
          type: number
          format: double
        example: 5.32
      - name: radiusMeter
        in: query
        description: "Radius i meter rundt lat/lon, maks 50 000."
        required: false
        schema:
          type: integer
          format: int32
        example: 5000
      - name: sorter
        in: query
        description: "relevans | avstand | navn. Standard: avstand ved nærhetssøk,\
          \ relevans ved fritekst, ellers navn."
        required: false
        schema:
          type: string
      - name: side
        in: query
        description: "Sidenummer, 0-indeksert."
        required: false
        schema:
          type: integer
          format: int32
        example: 0
      - name: storrelse
        in: query
        description: "Treff per side, standard 20, maks 100."
        required: false
        schema:
          type: integer
          format: int32
        example: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SokSvar"
  /masterdb/search/filter:
    get:
      tags:
      - Search
      summary: List filter options
      description: "Municipalities (code + name) and venue types, activities and facilities\
        \ (id + name) that are linked to a bookable resource."
      operationId: filtre
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SokFiltre"
components:
  schemas:
    LokaletypeUpdate:
      type: object
      properties:
        navn:
          type: string
          description: Name of the venue type. Must be unique.
          example: Gymsal
          minLength: 1
        parentId:
          type: integer
          format: int64
          description: Id of the parent venue type. Null or left out for a top-level
            venue type.
          example: 12
      required:
      - navn
    KommuneUpdate:
      type: object
      properties:
        kommunenr:
          type: string
          description: "Kommune number, exactly 4 digits"
          example: "4601"
          minLength: 1
          pattern: "[0-9]{4}"
        navn:
          type: string
          description: Kommune name
          example: Bergen
          minLength: 1
        fylkesnavn:
          type: string
          description: County name. Optional; null when left out.
          example: Vestland
      required:
      - kommunenr
      - navn
    FasilitetUpdate:
      type: object
      properties:
        navn:
          type: string
          description: Name of the facility. Must be unique.
          example: Garderobe
          minLength: 1
        parentId:
          type: integer
          format: int64
          description: Id of the parent facility. Null or left out for a top-level
            facility.
          example: 12
      required:
      - navn
    AktivitetUpdate:
      type: object
      properties:
        navn:
          type: string
          description: Name of the activity. Must be unique.
          example: Svømming
          minLength: 1
        parentId:
          type: integer
          format: int64
          description: Id of the parent activity. Null or left out for a top-level
            activity.
          example: 12
      required:
      - navn
    KommuneCreate:
      type: object
      properties:
        kommunenr:
          type: string
          description: "Kommune number, exactly 4 digits"
          example: "4601"
          minLength: 1
          pattern: "[0-9]{4}"
        navn:
          type: string
          description: Kommune name
          example: Bergen
          minLength: 1
        fylkesnavn:
          type: string
          description: County name. Optional; null when left out.
          example: Vestland
        bookingBaseUrl:
          type: string
          description: Base URL of the kommune's Aktiv kommune booking system. Required.
            Must be https://<name>.aktiv-kommune.no.
          example: https://bergen.aktiv-kommune.no
          minLength: 1
          pattern: "^https://([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)\\.aktiv-kommune\\\
            .no/?$"
        active:
          type: boolean
          description: "Whether the kommune's booking system is active. Required.\
            \ If true, the nightly sync loads data from the Aktiv kommune instance;\
            \ if false, the sync skips it until it is activated (PATCH /masterdb/kommune/{id}/booking)."
          example: true
      required:
      - active
      - bookingBaseUrl
      - kommunenr
      - navn
    Kommune:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: "Internal id, generated by the database. Use it in the URL\
            \ for get, update and delete."
          example: 17
        kommunenr:
          type: string
          description: "Kommune number, 4 digits"
          example: "4601"
        navn:
          type: string
          description: Kommune name
          example: Bergen
        fylkesnavn:
          type: string
          description: "County name, may be null"
          example: Vestland
        bookingBaseUrl:
          type: string
          description: "Base URL of the kommune's Aktiv kommune booking system. The\
            \ nightly sync loads data from here. Null if no booking system is registered,\
            \ in which case the kommune is not synced."
          example: https://bergen.aktiv-kommune.no
        bookingAktiv:
          type: boolean
          description: "Whether the booking system is included in the nightly sync.\
            \ Change it with PATCH /masterdb/kommune/{id}/booking. Null if no booking\
            \ system is registered."
          example: true
    FagsystemStatusUpdate:
      type: object
      properties:
        aktiv:
          type: boolean
          description: "true: the booking system is included in the nightly sync.\
            \ false: it is skipped, but the kommune and its data are kept."
          example: false
      required:
      - aktiv
    ByggSokTreff:
      type: object
      properties:
        byggId:
          type: integer
          format: int64
        byggNavn:
          type: string
        bydelNavn:
          type: string
        kommuneNavn:
          type: string
        adressetekst:
          type: string
        postnummer:
          type: string
        poststed:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        avstandMeter:
          type: number
          format: double
        antallRessurser:
          type: integer
          format: int32
        bookingUrl:
          type: string
        bildeUrl:
          type: string
    RessursSokTreff:
      type: object
      properties:
        ressursId:
          type: integer
          format: int64
        navn:
          type: string
        byggNavn:
          type: string
        kommuneNavn:
          type: string
        adressetekst:
          type: string
        postnummer:
          type: string
        poststed:
          type: string
        lokaletypeNavn:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        avstandMeter:
          type: number
          format: double
        bookingUrl:
          type: string
        bildeUrl:
          type: string
    SokSvar:
      type: object
      properties:
        bygg:
          $ref: "#/components/schemas/SokeResultatByggSokTreff"
        ressurser:
          $ref: "#/components/schemas/SokeResultatRessursSokTreff"
    SokeResultatByggSokTreff:
      type: object
      properties:
        treff:
          type: array
          items:
            $ref: "#/components/schemas/ByggSokTreff"
        totalt:
          type: integer
          format: int64
        side:
          type: integer
          format: int32
        storrelse:
          type: integer
          format: int32
    SokeResultatRessursSokTreff:
      type: object
      properties:
        treff:
          type: array
          items:
            $ref: "#/components/schemas/RessursSokTreff"
        totalt:
          type: integer
          format: int64
        side:
          type: integer
          format: int32
        storrelse:
          type: integer
          format: int32
    FilterValg:
      type: object
      properties:
        kode:
          type: string
        navn:
          type: string
    IdValg:
      type: object
      properties:
        id:
          type: integer
          format: int64
        navn:
          type: string
    SokFiltre:
      type: object
      properties:
        kommuner:
          type: array
          items:
            $ref: "#/components/schemas/FilterValg"
        lokaletyper:
          type: array
          items:
            $ref: "#/components/schemas/IdValg"
        aktiviteter:
          type: array
          items:
            $ref: "#/components/schemas/IdValg"
        fasiliteter:
          type: array
          items:
            $ref: "#/components/schemas/IdValg"
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-API-KEY
      in: header
