services:
  portico_masterdata:
    container_name: portico_masterdata
    hostname: portico_masterdata
    build:
        context: .
        dockerfile: Dockerfile
        network: host  # corporate proxy allow-lists by source IP; bridge NAT gets dropped
        args:
           http_proxy: ${http_proxy}
           https_proxy: ${https_proxy}
    ports:
      - "8083:8080"
    volumes:
      # Hele repoet - gir containeren tilgang til etl/ (for admin-trigget
      # last_inn.py) og etl/*_mapping/mapping.json, ikke bare backend/-koden.
      - .:/workspace
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/masterdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - ETL_WORKDIR=/workspace
    env_file:
      - .env.compose
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - portico_masterbase

  db:
    image: postgis/postgis:18-3.6
    container_name: portico_masterdb
    hostname: db
    restart: unless-stopped
    environment:
       POSTGRES_USER: postgres
       POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
       PGDATA: /data/postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/data/postgres
 #     - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - portico_masterbase

volumes:
  postgres_data:

networks:
  portico_masterbase:
    driver: bridge
