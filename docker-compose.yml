services:
  portico_masterdata:
    container_name: portico_masterdata
    hostname: portico_masterdata
    build:
        context: .
        dockerfile: Dockerfile
        network: host  # corporate proxy allow-lists by source IP; bridge NAT gets dropped
        args:
           http_proxy: ${http_proxy}
           https_proxy: ${https_proxy}
    ports:
      - "8083:80"
    volumes:
      - .:/var/www/html
    environment:
      - APACHE_RUN_USER=www-data
      - APACHE_RUN_GROUP=www-data
    env_file:
      - .env.compose
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - portico_masterbase

  db:
    image: postgres:18
    container_name: portico_masterdb
    hostname: db
    restart: unless-stopped
    environment:
       POSTGRES_USER: postgres
       POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
       PGDATA: /data/postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/data/postgres
 #     - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - portico_masterbase

volumes:
  postgres_data:

networks:
  portico_masterbase:
    driver: bridge
