services:
  db:
    image: postgis/postgis:18-3.6
    container_name: portico_masterdb
    hostname: db
    restart: unless-stopped
    environment:
       POSTGRES_USER: postgres
       POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
       POSTGRES_DB: masterdb
       PGDATA: /data/postgres
    ports:
      # Loopback only: reachable from the host (pgAdmin, psql), not from the network
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/data/postgres
 #     - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d masterdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - portico_masterbase

  backend:
    container_name: portico_masterdb_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host  # corporate proxy allow-lists by source IP; bridge NAT gets dropped
      args:
        http_proxy: ${http_proxy}
        https_proxy: ${https_proxy}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MASTERDB_API_KEY: ${MASTERDB_API_KEY:?Set MASTERDB_API_KEY in .env (see .env.example)}
      # Job server in the etl container, reachable on this network only
      ETL_URL: http://etl:8000
      DB_URL: jdbc:postgresql://db:5432/masterdb
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Healthy once Spring is up, which means Flyway has applied the schema.
      # The JRE image has no curl or wget, so the request is made with bash only.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - portico_masterbase

  etl:
    # The job server (etl/jobserver.py, port ETL_PORT, default 8000) has NO authentication.
    # Its only protection is that this service has no `ports:` mapping, so only containers
    # on this network can reach it. Never add `ports:` here.
    container_name: portico_masterdb_etl
    build:
      context: ./etl
      dockerfile: Dockerfile
      network: host  # corporate proxy allow-lists by source IP; bridge NAT gets dropped
      args:
        http_proxy: ${http_proxy}
        https_proxy: ${https_proxy}
    restart: unless-stopped
    environment:
      # Connection settings read by psql inside the container
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: masterdb
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      # Geocoding is skipped when the credentials are empty
      MATRIKKEL_BRUKER: ${MATRIKKEL_BRUKER:-}
      MATRIKKEL_PASSORD: ${MATRIKKEL_PASSORD:-}
      MATRIKKEL_MILJO: ${MATRIKKEL_MILJO:-test}
      KOMMUNER: ${KOMMUNER:-alle}
      SYNK_TID: ${SYNK_TID:-03:00}
      TZ: ${TZ:-Europe/Oslo}
      NORMALISER_DEMO: ${NORMALISER_DEMO:-true}
      DRY_RUN: ${DRY_RUN:-false}
      AVVIK_RETENTION_DAYS: ${AVVIK_RETENTION_DAYS:-30}
    volumes:
      # The SQL generated by the last runs, for review (docker compose exec etl ls ut)
      - etl_ut:/app/ut
      # Optional: extra CA certificates (PEM) for networks that inspect TLS; see certs/README.md
      - ./certs:/extra-ca:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - portico_masterbase

volumes:
  postgres_data:
  etl_ut:

networks:
  portico_masterbase:
    driver: bridge
